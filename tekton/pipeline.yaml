apiVersion: v1
kind: ServiceAccount
metadata:
  name: accounts-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: accounts-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: accounts-deployer
subjects:
  - kind: ServiceAccount
    name: accounts-deployer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: accounts-deployer
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: accounts-cd
spec:
  tasks:
    - name: deploy
      taskSpec:
        volumes:
          - name: manifests
            configMap:
              name: accounts-manifests
        steps:
          - name: apply
            image: registry.k8s.io/kubectl:v1.32.2
            command: ["/bin/kubectl"]
            args: ["apply", "-f", "/manifests/accounts.yaml"]
            volumeMounts:
              - name: manifests
                mountPath: /manifests
                readOnly: true
          - name: verify
            image: registry.k8s.io/kubectl:v1.32.2
            command: ["/bin/kubectl"]
            args: ["rollout", "status", "deployment/accounts", "--timeout=180s"]
