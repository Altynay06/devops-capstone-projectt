name: Accounts CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint
        run: flake8 service tests --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests
        run: nosetests -v --with-coverage --cover-package=service

      - name: Exercise Accounts API with curl
        shell: bash
        run: |
          gunicorn --bind 127.0.0.1:8080 service:app > accounts-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          base=http://127.0.0.1:8080
          for attempt in {1..20}; do
            if curl --silent --fail --output /dev/null "$base/health"; then
              break
            fi
            sleep 1
          done
          if ! curl --silent --fail --output /dev/null "$base/health"; then
            cat accounts-server.log
            exit 1
          fi

          set -x
          curl --silent --show-error --fail-with-body --include --request POST \
            --header 'Content-Type: application/json' \
            --data '{"name":"Demo Customer","email":"demo@example.com","address":"1 Demo Street"}' \
            "$base/accounts" | tee rest-create-done.txt
          resource=$(awk 'tolower($1) == "location:" { sub(/\r$/, "", $2); print $2 }' rest-create-done.txt)
          test -n "$resource"
          curl --silent --show-error --fail-with-body --include "$base/accounts" | tee rest-list-done.txt
          curl --silent --show-error --fail-with-body --include "$resource" | tee rest-read-done.txt
          curl --silent --show-error --fail-with-body --include --request PUT \
            --header 'Content-Type: application/json' \
            --data '{"name":"Demo Customer","email":"demo@example.com","address":"2 Demo Street"}' \
            "$resource" | tee rest-update-done.txt
          curl --silent --show-error --fail-with-body --include --request DELETE "$resource" | tee rest-delete-done.txt
          set +x

      - name: Build and verify the Accounts Docker image
        shell: bash
        run: |
          docker build -t accounts:1.0 .
          docker image ls accounts:1.0
          docker run --detach --name accounts --network host --env DATABASE_URI accounts:1.0
          trap 'docker logs accounts; docker rm -f accounts' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 http://localhost:8080/

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          version: v0.27.0
          cluster_name: accounts-ci

      - name: Deploy and verify Accounts on Kubernetes
        shell: bash
        run: |
          kind load docker-image accounts:1.0 --name accounts-ci
          kubectl create secret generic accounts-database --from-literal=password="$(openssl rand -hex 24)"
          kubectl apply -f deploy/postgres.yaml
          kubectl rollout status deployment/accounts-postgres --timeout=180s
          kubectl apply -f deploy/accounts.yaml
          kubectl rollout status deployment/accounts --timeout=180s
          kubectl get deployments,pods,replicasets,services -o wide | tee kube-deploy-accounts.txt

          kubectl port-forward service/accounts 8080:8080 > accounts-port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8080/ | tee kube-app-output.txt

      - name: Run Tekton deployment pipeline
        shell: bash
        run: |
          kubectl apply -f https://storage.googleapis.com/tekton-releases/pipeline/previous/v1.0.0/release.yaml
          kubectl -n tekton-pipelines rollout status deployment --timeout=240s

          kubectl create namespace accounts-cd
          kubectl -n accounts-cd create secret generic accounts-database --from-literal=password="$(openssl rand -hex 24)"
          kubectl -n accounts-cd apply -f deploy/postgres.yaml
          kubectl -n accounts-cd rollout status deployment/accounts-postgres --timeout=180s
          kubectl -n accounts-cd create configmap accounts-manifests --from-file=deploy/accounts.yaml
          kubectl -n accounts-cd apply -f tekton/pipeline.yaml
          kubectl -n accounts-cd apply -f tekton/pipeline-run.yaml

          run_ok=0
          kubectl -n accounts-cd wait --for=condition=Succeeded pipelinerun/accounts-cd --timeout=300s || run_ok=1
          {
            kubectl -n accounts-cd get pipelinerun accounts-cd
            kubectl -n accounts-cd get taskruns
            kubectl -n accounts-cd logs -l tekton.dev/pipelineRun=accounts-cd --all-containers --prefix || true
          } | tee pipelinerun.txt
          test "$run_ok" -eq 0
